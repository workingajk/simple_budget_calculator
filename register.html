<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="./script.js"></script>
    </head>
    <body class="flex justify-center items-center h-[100vh] gap-24 p-30">
        <div class="w-full text-center">
            <h1 class="text-4xl font-bold text-violet-700">
                Budget Calculator
            </h1>
            <p class="mt-4 text-lg text-gray-600">
                Plan your spending, track your expenses, and reach your savings
                goals.
            </p>
        </div>

        <div class="flex flex-col bg-violet-200 p-10 gap-4 rounded-md w-full">
            <h1 class="text-center font-bold text-2xl pb-6">Register</h1>
            <input
                type="text"
                id="uname"
                placeholder="User Name"
                class="outline-1 rounded-md py-1 px-3"
            />
            <input
                type="email"
                id="email"
                placeholder="Email"
                class="outline-1 rounded-md py-1 px-3"
            />
            <input
                type="password"
                id="password"
                placeholder="Password"
                class="outline-1 rounded-md py-1 px-3"
            />
            <div class="flex flex-col gap-2 justify-center">
                <button
                    class="outline-1 rounded-md py-1 px-3 bg-violet-700 text-white"
                    onclick="register()"
                >
                    Register
                </button>
                <p class="text-center">
                    Already registed? <a href="./login.html" class="text-violet-700">Login</a>
                </p>
            </div>
        </div>
        <script>
            localStorage.setItem("currUser", "");
        </script>
    </body>
</html>
