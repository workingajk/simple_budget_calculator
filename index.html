<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Budget Calculator</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="./script.js"></script>
        <style>
            tbody tr:nth-child(even) {
                background: #f8fafc;
            }

            tbody td {
                border-top: 1px solid #e2e8f0;
                padding: 0.75rem 0.5rem;
            }
        </style>
    </head>
    <body class="min-h-screen bg-gradient-to-br from-slate-50 via-violet-50 to-emerald-50 text-slate-800">
        <header class="sticky top-0 z-10 bg-white/90 shadow-sm border-b border-violet-100 backdrop-blur">
            <div
                class="max-w-6xl mx-auto flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 p-4"
            >
                <div>
                    <p class="text-sm font-semibold text-violet-500 uppercase">Personal Finance</p>
                    <h1 class="font-bold text-3xl text-violet-900">Budget Calculator</h1>
                </div>
                <div class="flex gap-4 items-center justify-between">
                    <h4 class="text-lg text-slate-700">
                        Welcome <span id="uname" class="font-semibold text-violet-800">Rajappan</span>
                    </h4>
                    <button
                        class="font-bold text-1xl bg-violet-700 text-white py-2 px-4 rounded-md shadow-sm hover:bg-violet-800 transition"
                        onclick="logout()"
                    >
                        Logout
                    </button>
                </div>
            </div>
        </header>
        <main class="max-w-6xl mx-auto py-6">
        <section class="grid md:grid-cols-2 p-4 gap-6">
            <div
                class="bg-white flex flex-col items-center p-6 gap-4 rounded-lg shadow-md border border-emerald-100 hover:shadow-lg transition"
            >
                <div
                    class="size-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl font-bold"
                >
                    +
                </div>
                <p class="text-2xl font-semibold text-emerald-700">Income</p>
                <select
                    name=""
                    id="income_type"
                    class="bg-slate-50 py-2 px-3 rounded-md border border-slate-200 w-full max-w-xs outline-none focus:ring-2 focus:ring-emerald-300"
                    required
                >
                    <option value="" disabled selected>
                        Select Income Type
                    </option>
                    <option value="Salary">Salary</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Business">Business</option>
                    <option value="Investments">Investments</option>
                    <option value="Other">Other Income</option>
                </select>

                <input
                    type="number"
                    class="bg-slate-50 py-2 px-3 rounded-md border border-slate-200 w-full max-w-xs outline-none focus:ring-2 focus:ring-emerald-300"
                    placeholder="Add Income"
                    id="income"
                />
                <button
                    class="font-bold text-1xl bg-emerald-600 text-white py-2 px-6 rounded-md shadow-sm hover:bg-emerald-700 transition"
                    onclick="addIncome()"
                >
                    Add
                </button>
            </div>
            <div
                class="bg-white flex flex-col items-center p-6 gap-4 rounded-lg shadow-md border border-rose-100 hover:shadow-lg transition"
            >
                <div
                    class="size-12 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center text-2xl font-bold"
                >
                    -
                </div>
                <p class="text-2xl font-semibold text-rose-700">Expense</p>
                <select
                    name=""
                    id="expense_type"
                    class="bg-slate-50 py-2 px-3 rounded-md border border-slate-200 w-full max-w-xs outline-none focus:ring-2 focus:ring-rose-300"
                    required
                >
                    <option value="" disabled selected>
                        Select Expense Type
                    </option>
                    <option value="Rent">Rent</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other Expenses</option>
                </select>

                <input
                    type="number"
                    id="expense"
                    class="bg-slate-50 py-2 px-3 rounded-md border border-slate-200 w-full max-w-xs outline-none focus:ring-2 focus:ring-rose-300"
                    placeholder="Add Expense"
                />
                <button
                    class="font-bold text-1xl bg-rose-600 text-white py-2 px-6 rounded-md shadow-sm hover:bg-rose-700 transition"
                    onclick="addExpense()"
                >
                    Add
                </button>
            </div>
        </section>

        <section class="flex flex-col justify-center items-center px-4">
            <div
                class="flex flex-col justify-center items-center bg-gradient-to-r from-violet-700 to-indigo-700 text-white p-6 rounded-lg shadow-lg w-full max-w-xl border border-white/30"
            >
                <p class="text-sm font-semibold text-violet-100 uppercase">Available Balance</p>
                <p class="font-semibold text-xl">
                    Net Balance : Rs.
                    <span id="balance" class="text-4xl font-bold"> 0</span>
                </p>
                <div id="summary"></div>
            </div>
        </section>

        <section class="grid lg:grid-cols-2 p-4 gap-6">
            <div class="flex flex-col bg-white p-5 w-full rounded-lg shadow-md border border-emerald-100 overflow-x-auto">
                <h1 class="text-2xl text-center pb-3 font-semibold text-slate-700">Income Log</h1>
                <table
                    class="border-separate border-spacing-0 overflow-hidden rounded-md border border-slate-200 table-auto w-full min-w-[28rem] text-center"
                >
                    <thead class="bg-emerald-50 text-emerald-800">
                        <tr>
                            <th class="p-2">Date</th>
                            <th class="p-2">Type</th>
                            <th class="p-2">Amount</th>
                            <th class="p-2">Balance</th>
                        </tr>
                    </thead>
                    <tbody id="income_table"></tbody>
                </table>
            </div>
            <div class="flex flex-col bg-white p-5 w-full rounded-lg shadow-md border border-rose-100 overflow-x-auto">
                <h1 class="text-2xl text-center pb-3 font-semibold text-slate-700">Expense Log</h1>
                <table
                    class="border-separate border-spacing-0 overflow-hidden rounded-md border border-slate-200 table-auto w-full min-w-[28rem] text-center"
                >
                    <thead class="bg-rose-50 text-rose-800">
                        <tr>
                            <th class="p-2">Date</th>
                            <th class="p-2">Type</th>
                            <th class="p-2">Amount</th>
                            <th class="p-2">Balance</th>
                        </tr>
                    </thead>
                    <tbody id="expense_table"></tbody>
                </table>
            </div>
        </section>
        </main>

        <script>
            let currUser = JSON.parse(localStorage.getItem(
                localStorage.getItem("currUser"),
            ))

            console.log(currUser);

            if (currUser == null || currUser == "") {
                window.location.href = "./login.html";
            } else {
                uname.textContent = currUser.name;
            }
            updateTable();
        </script>
    </body>
</html>
