<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login | Budget Calculator</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <script src="./script.js"></script>
    </head>
    <body class="min-h-screen bg-gradient-to-br from-slate-50 via-violet-50 to-emerald-50 text-slate-800">
        <main class="min-h-screen max-w-6xl mx-auto grid lg:grid-cols-2 items-center gap-10 p-6">
            <section class="text-center lg:text-left">
                <p class="text-sm font-semibold text-violet-500 uppercase">
                    Personal Finance
                </p>
                <h1 class="mt-2 text-5xl font-bold text-violet-900">
                    Budget Calculator
                </h1>
                <p class="mt-4 text-lg text-slate-600 max-w-md mx-auto lg:mx-0">
                    Plan your spending, track your expenses, and reach your
                    savings goals with a cleaner view of your money.
                </p>
                <div class="mt-8 flex justify-center lg:justify-start gap-3">
                    <span class="px-4 py-2 rounded-md bg-white border border-emerald-100 text-emerald-700 shadow-sm">Income</span>
                    <span class="px-4 py-2 rounded-md bg-white border border-rose-100 text-rose-700 shadow-sm">Expense</span>
                    <span class="px-4 py-2 rounded-md bg-white border border-violet-100 text-violet-700 shadow-sm">Balance</span>
                </div>
            </section>

        <section class="flex flex-col bg-white p-8 sm:p-10 gap-4 rounded-lg w-full max-w-md mx-auto shadow-xl border border-violet-100">
            <h1 class="text-center font-bold text-3xl pb-4 text-violet-900">Login</h1>
            <!-- <input type="text" placeholder="Username" class="outline-1 rounded-md py-1 px-3"> -->
            <input
                type="email"
                placeholder="Email"
                class="bg-slate-50 rounded-md py-3 px-4 border border-slate-200 outline-none focus:ring-2 focus:ring-violet-300"
                id="email"
            />
            <input
                type="password"
                placeholder="Password"
                class="bg-slate-50 rounded-md py-3 px-4 border border-slate-200 outline-none focus:ring-2 focus:ring-violet-300"
                id="password"
            />
            <div class="flex flex-col gap-3 justify-center pt-2">
                <button
                    class="rounded-md py-3 px-4 bg-violet-700 text-white font-bold shadow-sm hover:bg-violet-800 transition"
                    onclick="login()"
                >
                    Login
                </button>
                <p class="text-center text-slate-600">
                    Don't have an Account?
                    <a href="./register.html" class="text-violet-700 font-semibold hover:text-violet-900">Register</a>
                </p>
            </div>
        </section>
        </main>
        <script>
            localStorage.setItem("currUser", "");
        </script>
    </body>
</html>
